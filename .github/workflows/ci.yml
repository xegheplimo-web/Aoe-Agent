name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: 'ci / scope'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: scope guard + secret scan
        if: github.event_name == 'pull_request'
        run: bash scripts/scope-check.sh "${{ github.repository }}" "${{ github.event.pull_request.number }}"
        env:
          BASE_SHA: origin/${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        run: echo "scope guard is a PR-only judge — pass"

  verify:
    name: 'ci / verify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prettier --check .
      - name: build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db

  verify-python:
    name: 'ci / verify-python'
    runs-on: windows-latest # desktop agent is Windows-targeted (pywin32, pyautogui, mss)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff mypy
      - run: ruff check .
      - run: mypy aoe1
      - run: python -m unittest discover -s tests -v

  security:
    name: 'ci / security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: npm audit (critical only)
        run: npm audit --audit-level=critical
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: pip-audit
        run: python -m pip install pip-audit && pip-audit -r requirements.txt

  review-gate:
    name: 'ci / review-gate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: wait for review on current head, zero unresolved threads
        if: github.event_name == 'pull_request'
        run: bash scripts/review-gate.sh "${{ github.repository }}" "${{ github.event.pull_request.number }}" "${{ github.event.pull_request.head.sha }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        run: echo "review gate is a PR-only judge — pass"
